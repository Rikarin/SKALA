# docs/plan/12 § "4. Fuzzing" and § "Testing the rules" addition 2, as a workflow.
#
# Two jobs, both nightly, both unbounded-ish, both reproducible from what they record. Neither
# gates a pull request: a nightly job that can block a merge is a nightly job somebody disables.

name: Nightly

on:
  schedule:
    # 03:17 UTC. ⚠ Not on the hour: GitHub's scheduler queues every `0 * * * *` job on the planet at
    # once and a run that starts forty minutes late is a run whose "nightly" is a lie.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Fuzz seed. Empty means the run id. A failure replays from the case seed it prints."
        required: false
        default: ""
      minutes:
        description: "Fuzz budget in minutes. doc 12 asks for a time budget rather than a case count."
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────────────────────
  # doc 12 § "4. Fuzzing", all four parts of it.
  #
  # ⚠ **This job's header used to say that three of the four did not exist**, and listing them was
  # the honest thing to do at M7 — the job ran the property suite over the committed corpus, which
  # is a regression suite rather than a fuzzer. They exist now, in `Testing/Rikarin.Skala.Testing`:
  #
  #   ✓ **Mutation fuzzing**, seeded. Nineteen parse-preserving mutations over a corpus file —
  #     whitespace, comments at trivia positions, `#if` blocks, line-ending swaps, BOM injection,
  #     identifier widening — split into the five whitespace-only ones the strong property
  #     `format(mutate_whitespace(x)) ≡ format(x)` is asserted over and the fourteen structural
  #     ones it is not.
  #   ✓ **Generative fuzzing** from a grammar weighted toward generics, lambdas, patterns,
  #     initializers, attributes and raw strings, printed with random whitespace.
  #   ✓ **A delta-debugging minimiser** behind every failure, and
  #     `Testing/corpus/pathological/open/` for what it produces.
  #   ✓ **The properties**, now seven and asserted over both halves under both symbol sets.
  #
  # ⚠ **Two steps, and the difference between them is the point.** The property suite over the
  # committed corpus is a *gate*: it must pass, and a failure means a regression. The fuzz run is an
  # *expedition*: it explores inputs nobody has committed, and a failure means a discovery. Running
  # both here, in that order, is what makes a red nightly readable — the gate says whether today
  # broke something, the expedition says what was found.
  #
  # ⚠ The seed is now read. `--seed` reaches `FuzzRandom`, every case is
  # `FuzzRandom.Derive(seed, index)` and nothing else, and a failure prints the case seed it
  # replays from. A twelve-hour run that stopped on case 41 907 hands back one number that rebuilds
  # that case in a second, on any machine, on any runtime — which is why the stream is SplitMix64
  # rather than `System.Random`, whose sequence for a seed is an implementation detail .NET has
  # changed before.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  fuzz:
    name: the properties, and the fuzzer over them
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Skala.slnx -c Release

      # ⚠ The properties, not the fidelity number. Fidelity is a measurement against a ratchet and
      # belongs to the gate; a property is a statement that must hold for every input, which is the
      # thing a fuzzer exists to falsify.
      - name: The gate — the properties over every corpus file, under both symbol sets
        run: ./build.sh Conformance --configuration Release

      # ⚠ A **time budget**, which is what doc 12 asks for, rather than a case count. The clock
      # bounds the loop and never enters a case: a run that managed 41 907 cases on a fast runner
      # and 18 200 on a slow one executed the same first 18 200, and any of them replays from its
      # own seed. The report says what the run covered — cases, how many reached the formatter, how
      # many corpus files were mutated, how many units were generated, and the histogram of which
      # mutations were drawn — because "the fuzzer found nothing" means nothing without it.
      #
      # ⚠ `continue-on-error`, and it is not laxity. A finding here is a *discovery about an input
      # nobody has committed*, and the two steps after it are the ones that turn it into something
      # actionable; failing the job at this line would skip them. The job still goes red, at the
      # gate below, once the artefacts are safe.
      - name: The expedition — seeded mutation and generative fuzzing, on a time budget
        id: fuzz
        continue-on-error: true
        run: >
          dotnet run --project Testing/Rikarin.Skala.Testing -c Release --no-build --
          fuzz
          --seed=${{ inputs.seed || github.run_id }}
          --minutes=${{ inputs.minutes || 60 }}
          --arrange-every=25
          --out=.skala/fuzz

      # ⚠ Break the formatter deliberately, one property at a time, and check the fuzzer notices.
      # A fuzzer that finds nothing on a given night is the ordinary case; a fuzzer that *cannot*
      # find anything looks exactly the same from the outside, and this is the difference. It caught
      # a real gap the day it was written: range consistency could not tell a correct edit list from
      # one collapsed into a single whole-file edit.
      - name: The fuzzer's own oracle, mutation-tested
        run: >
          dotnet run --project Testing/Rikarin.Skala.Testing -c Release --no-build --
          fuzz --mutation-test --cases=400 --seed=${{ inputs.seed || github.run_id }}

      - name: Publish the fuzz report
        if: always()
        run: cat .skala/fuzz.md >> "$GITHUB_STEP_SUMMARY" || true

      # ⚠ `if: always()`, because the artefacts matter exactly when a step above failed. Two kinds:
      # the crash snapshot the formatter writes for itself under `.skala/crash/<hash>/`
      # (`CrashArtifacts`), and the **minimised** artefact the fuzzer writes under `.skala/fuzz/` —
      # one `.cs` file per property found, byte for byte with no trailing trim, beside a `.txt`
      # naming the seed, the origin file, the mutation sequence and how the property fails on the
      # reduction. doc 12 § "Corpus expansion": that file is what gets committed to
      # `Testing/corpus/pathological/`, and it is now a download rather than an afternoon.
      - name: Keep the crash snapshots and the minimised findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: |
            .skala/crash/
            .skala/fuzz/
            .skala/fuzz.md
          if-no-files-found: ignore

      # ⚠ Now the job goes red, after the artefacts are safe and the report is in the summary.
      # `continue-on-error` above deferred the failure; it did not forgive it.
      - name: Fail if the expedition found something
        if: steps.fuzz.outcome == 'failure'
        run: |
          echo "::error::the fuzzer found a property violation — see the run summary and the"
          echo "::error::fuzz-findings artefact. Each finding replays from its own seed with"
          echo "::error::  dotnet run --project Testing/Rikarin.Skala.Testing -- fuzz --replay=<seed>"
          echo "::error::and is committed to Testing/corpus/pathological/open/ with a register entry."
          exit 1

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # doc 12 § "Testing the rules", addition 2: every rule over the whole reference corpus, its
  # finding count recorded, and a rule whose count moves more than 10 % between commits flagged.
  #
  # ⚠ `.expected.cs` is excluded by the `find`, and it is not tidiness. The corpus holds 380 source
  # files and 380 committed oracle outputs beside them; analysing both doubles every count, makes
  # SK7020 report each file as a clone of its own twin, and — worst — makes `./build.sh Oracle`, a
  # deliberate reviewed regeneration that changes no rule, register as a drift in every rule at
  # once. Measured on the 380: 4.0 s, 291 files with findings, 576 findings from 30 rules.
  #
  # ⚠ `--load=loose`, so the semantic rules do not run and their counts are 0. That is recorded in
  # the file as `"mode": "loose"` and the comparison refuses to compare across modes, because two
  # runs under different modes differ for reasons that have nothing to do with the rules and
  # reporting that as a regression is how a nightly job gets muted. The corpus is loose files
  # vendored from three trees with no project to build; making the semantic half of the catalogue
  # measurable here needs a buildable corpus, which is a separate piece of work.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  rule-counts:
    name: rule-count drift over the reference corpus
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Skala.slnx -c Release

      - name: Run every rule over corpus/real
        run: >
          dotnet run --project Tools/Rikarin.Skala.Cli -c Release --no-build --
          check
          --load=loose --no-cache --include-hints --duplication
          --format=plain --output .skala/rule-counts.sarif
          $(find Testing/corpus/real -name '*.cs' ! -name '*.expected.cs' | sort)

      - name: Record the counts
        run: >
          python3 .github/scripts/rule-counts.py record
          .skala/rule-counts.sarif .skala/rule-counts.current.json
          --corpus corpus/real --mode loose

      # ⚠ The committed baseline is `.skala/rule-counts.json`, and it is tracked despite
      # `.skala/.gitignore` being `*` — an ignore rule has no effect on a file git already tracks.
      # doc 12 names that path and it is the right one: the counts are an artefact of the tool's own
      # run, like the report and the baseline beside them.
      #
      # ⚠ Nothing here commits the new file. "Without an intentional change" is the whole condition,
      # and a job that silently rewrites the baseline every night makes every change intentional and
      # the check vacuous. A drift fails this job; the fix is a human commit that regenerates the
      # baseline alongside the rule change that caused it, and the failure output prints that
      # command.
      - name: Compare against the committed baseline
        run: >
          python3 .github/scripts/rule-counts.py compare
          .skala/rule-counts.json .skala/rule-counts.current.json
          --threshold 10 --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the counts and the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rule-counts
          path: |
            .skala/rule-counts.current.json
            .skala/rule-counts.sarif
