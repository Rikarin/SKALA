# docs/plan/18-versioning-and-release.md, as a workflow. Also 02 § "Package boundaries" and
# 11 § "Distribution".
#
# ⚠ **The version is measured, not declared.** `skala-release plan` builds the previous release's
# tool beside this one's and runs five detectors over the pair: the corpus formatted by both
# binaries, the rule catalogue, the exit-code table *and* the codes the binaries actually produce,
# the SARIF each one writes, and the option registry. The number is the highest verdict. Nothing
# reads a commit message — doc 18 § "Why not conventional commits" has the argument, and its short
# form is that four times in this project's history a summary and a measurement disagreed and the
# measurement was right.
#
# It computes the version, packs every artefact, writes the release notes from the measurements,
# uploads everything, and **publishes the packages to nuget.org on every run**. A `master` push
# publishes the measured `X.Y.Z-alpha.N`; `--skip-duplicate` makes a re-run a no-op. Tagging and the
# GitHub Release happen only on a `workflow_dispatch` with `release: true` — see the `publish` job
# for why that one part cannot run on every push.
#
# ⚠ **When it does publish, it publishes keylessly.** No NuGet API key is stored in this repository
# and none should be added: the `publish` job exchanges a GitHub OIDC token for a one-hour key
# (docs/plan/18 § "Publishing is keyless"). The policy on nuget.org matches this file's *name* and
# the `nuget` environment, so renaming either breaks publishing silently until the next release.
#
# Two facts drive the pack shape below.
#
#   1. **Every package is portable.** ⚠ The tool package used to be RID-specific, with one pack job
#      per RID, because its command was a NativeAOT binary that can only be produced on the platform
#      it targets. That binary was the thin client in front of the format daemon; both are deleted,
#      the command is an ordinary `Runner="dotnet"` entry point again, and one .nupkg installs
#      everywhere. The matrix below is now about *where the smoke test runs*, not about what it
#      builds — three OSes install the same bytes.
#   2. **A package that installs and cannot format a file is the thing this exists to catch.** Every
#      leg installs what it just built, into a scratch directory outside the checkout, and runs the
#      commands. The deep-path case is kept: it no longer exercises a socket path against the
#      kernel's 104-byte cap, but a deeply nested repository has other ways to go wrong and the case
#      costs one `mkdir -p`.

name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Cut a release rather than measure the master build. Still publishes nothing.
        type: boolean
        default: false
      baseline-ref:
        description: The release to measure against; empty means the highest `v*` tag.
        required: false
        default: ""
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # ⚠ One at a time, and a superseded master build is cancelled. Two release jobs racing produce
  # two answers to "what is the next version", and the loser's artefacts look exactly like winners.
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # ── The measurement, and the version it implies ───────────────────────────────────────────────
  #
  # ⚠ One job, on one platform, and deliberately not in the matrix. The five surfaces are
  # platform-independent by construction — the corpus, two registries, a markdown table and a SARIF
  # — and measuring them three times would produce three version numbers that have to agree.
  measure:
    name: measure the version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      bump: ${{ steps.plan.outputs.bump }}
      baseline: ${{ steps.plan.outputs.baseline }}

    steps:
      # ⚠ Full history and every tag. `fetch-depth: 0` is what makes `git describe`, the tag list
      # and `git archive <tag>` work; the default shallow clone has no tags and the baseline
      # detector would silently become "first release" on every run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # ⚠ **The baseline is materialised and built here, in bash, not inside the NUKE target.**
      # `./build.sh ReleasePlan --baseline-ref` can do it, and on at least one machine it cannot:
      # building the previous release's CLI project from inside the NUKE process fails with
      # `CS0234: 'Options' does not exist in the namespace 'Rikarin.Skala'` on the two projects the
      # CLI reaches transitively, from a tree that is byte-identical to one that builds. A release
      # measurement must not turn on that, so the step that has to work is the one written here.
      # docs/plan/18 § "Running it".
      #
      # ⚠ The **solution**, not the CLI project: a solution build has a complete, explicit project
      # graph and no transitive inference to get wrong.
      - name: Build the previous release
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          reference="${{ github.event.inputs.baseline-ref }}"
          if [ -z "$reference" ]; then
            reference="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          fi

          if [ -z "$reference" ]; then
            echo "No \`v*\` tag and no baseline-ref: this is the first release and nothing can be measured."
            echo "directory=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          directory="$RUNNER_TEMP/skala-baseline"
          rm -rf "$directory" && mkdir -p "$directory"
          git archive --format=tar "$reference" | tar -x -C "$directory"
          ( cd "$directory" && dotnet build Skala.slnx --configuration Release )

          echo "directory=$directory"                  >> "$GITHUB_OUTPUT"
          echo "version=${reference#v}"                >> "$GITHUB_OUTPUT"
          echo "height=$(git rev-list --count "$reference"..HEAD)" >> "$GITHUB_OUTPUT"

      - name: Measure
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          arguments=(--configuration Release)
          if [ -n "${{ steps.baseline.outputs.directory }}" ]; then
            arguments+=(
              --baseline-directory "${{ steps.baseline.outputs.directory }}"
              --baseline-version "${{ steps.baseline.outputs.version }}"
              --height "${{ steps.baseline.outputs.height }}"
            )
          fi
          if [ "${{ github.event.inputs.release }}" = "true" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            arguments+=(--release)
          fi

          ./build.sh ReleasePlan "${arguments[@]}"

          version=$(jq -r .version artifacts/release/version.json)
          echo "version=$version"                            >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .tag artifacts/release/version.json)"   >> "$GITHUB_OUTPUT"
          echo "bump=$(jq -r .bump artifacts/release/version.json)" >> "$GITHUB_OUTPUT"
          echo "baseline=$(jq -r '.previous // ""' artifacts/release/version.json)" >> "$GITHUB_OUTPUT"

      # ⚠ The notes go in the job summary, whole. They are the deliverable (doc 18 § "The notes are
      # the deliverable") and a reader should not have to download an artefact to see that this
      # release moves 400 files.
      - name: The release notes
        shell: bash
        run: cat artifacts/release/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: |
            artifacts/release/release-notes.md
            artifacts/release/changelog-entry.md
            artifacts/release/version.json
          if-no-files-found: error

  pack:
    name: pack and install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: measure

    strategy:
      # ⚠ The whole value of a matrix is knowing whether a failure is everywhere or on one platform.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # ⚠ The full suite before anything is packed. A green pack over a red tree is an artefact
      # nobody should be able to reach for.
      #
      # ⚠ **`dotnet build` + `dotnet test`, not `./build.sh Test`, and the difference is only visible
      # on Windows.** Under NUKE, two different `Workspace_…` tests in `Analysis.Tests` failed on the
      # Windows runner on consecutive commits with `System.Exception : The build host was started but
      # we were unable to connect to it's pipe` → `TimeoutException` — Roslyn's `MSBuildWorkspace`
      # starting its out-of-process build host. The same tests, same commit, same OS, pass in
      # cross-platform.yml, which runs exactly the two commands below. NUKE evaluates MSBuild in its
      # own process before spawning `dotnet test` (its log carries a suppressed
      # `Could not load file or assembly 'NuGet.Frameworks'` from that evaluation), and the child
      # inherits whatever that leaves behind.
      #
      # ⚠ **The mechanism is not isolated** — this is the invocation that works, not a diagnosis. If
      # the pipe timeout returns here, the environment the build host inherits is the place to look.
      #
      # ⚠ `--no-build`, so this cannot silently rebuild in Debug and test something other than what
      # the line above compiled under TreatWarningsAsErrors.
      - name: Build
        run: dotnet build Skala.slnx -c Release
        shell: bash

      # ⚠ **`VSTEST_CONNECTION_TIMEOUT` is in SECONDS and the default is 90.** The Windows runner
      # aborted a run at `f61a64a1` on `vstest.console process failed to connect to testhost process
      # after 90 seconds` — a handshake between the runner and the test host, not a test. ⚠ Not the
      # same thing as the `MSBuildWorkspace` build-host pipe timeout the Release job's Build step
      # comments on, which is Roslyn starting its own child process; these are two different
      # processes failing to be started on the same slow runner. The tell here is that
      # every project still reports `Failed: 0` and the aborted project passes when it re-runs
      # seconds later; only the abort sets the exit code, so the job goes red with nothing red in it.
      # Do not read a green run here as evidence the timeout was the problem: it is a race, and it
      # loses only sometimes.
      - name: Test
        run: dotnet test Skala.slnx -c Release --no-build
        env:
          VSTEST_CONNECTION_TIMEOUT: 300
        shell: bash

      # ⚠ The measured number is stamped in, and `Directory.Build.props` is not edited. One source
      # of truth stays the source of truth; the release overrides it for the duration of one pack.
      #
      # ⚠ **`--package-version`, not `-- -p:Version=`.** The `--` form was silently discarded: NUKE
      # takes what follows `--` as its own additional arguments and the `Pack` target never forwarded
      # them to `DotNetPack`, so every package was stamped `2.0.0-alpha.1` from `Directory.Build.props`
      # while the notes, the summary and the Release title said `2.0.0-alpha.2`. `2.0.0-alpha.1` is on
      # nuget.org because of it.
      - name: Pack
        shell: bash
        run: |
          ./build.sh Pack --configuration Release \
            --package-version ${{ needs.measure.outputs.version }}

      # The contents, listed. ⚠ Not decoration: three packaging faults in this repository's history
      # were invisible in the pack log and obvious in the file list — 19 files one directory too
      # deep, a 13 MB symbol bundle, and 6.6 MB of resources for languages the tool cannot use.
      - name: List what was packed
        shell: bash
        run: |
          for package in artifacts/packages/*.nupkg; do
            echo "=== $package ($(wc -c < "$package") bytes)"
            unzip -l "$package"
          done

      - name: Install smoke test
        shell: bash
        run: .github/scripts/install-smoke-test.sh "$(pwd)/artifacts/packages"

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  # ⚠ A separate job, and it takes **one** leg's artifact rather than merging all three. Every
  # package is portable now, so the three legs produce the same five packages; downloading all three
  # into one directory would silently keep whichever landed last, which is a coin toss dressed up as
  # a build step. One leg is picked, on purpose, and the other two exist to prove the install works
  # on their platform.
  collect:
    name: collect the packages, and tag
    runs-on: ubuntu-latest
    needs: [measure, pack]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v7
        with:
          name: packages-ubuntu-latest
          path: packages

      - uses: actions/upload-artifact@v7
        with:
          name: packages-portable
          path: packages/*.nupkg
          if-no-files-found: error

      # ⚠ **The tag is created and not pushed.** It exists so that the artefacts of this run and the
      # measurement behind them name one commit, and so that the next run has something to measure
      # against the moment somebody pushes it. `git push --tags` is in the publish job, behind the
      # flag, with everything else that leaves this machine.
      # ⚠ **A git identity, because `git tag -a` is a commit-shaped object and a runner has none.**
      # The release failed here on its first real run — `fatal: empty ident name` — and it failed in
      # `collect`, *after* three OS legs had built, tested, packed and smoke-tested the packages.
      # cross-platform.yml has set an identity for this reason since it started driving real git; this
      # workflow never did, because until the promotion landed no dispatch had ever reached an
      # annotated tag.
      - name: Give git an identity
        run: |
          git config user.email "release@skala.invalid"
          git config user.name "Skala Release"

      - name: Create the tag, locally
        if: github.event.inputs.release == 'true'
        run: |
          git tag -a "${{ needs.measure.outputs.tag }}" \
            -m "Skala ${{ needs.measure.outputs.version }} — ${{ needs.measure.outputs.bump }} against ${{ needs.measure.outputs.baseline || 'no previous release' }}"
          git show-ref --tags "${{ needs.measure.outputs.tag }}"

      # ⚠ The last step, and it is a message rather than an action. See this file's header.
      - name: What a publish would do, and did not
        run: |
          {
            echo "## Nothing has been published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`${{ needs.measure.outputs.version }}\` |"
            echo "| measured against | \`${{ needs.measure.outputs.baseline }}\` |"
            echo "| verdict | **${{ needs.measure.outputs.bump }}** |"
            echo "| tag | \`${{ needs.measure.outputs.tag }}\` — created in this job, **not pushed** |"
            echo
            echo "A publish would push these to nuget.org, push the tag, and open a GitHub Release"
            echo "with the notes above:"
            echo
            for package in packages/*.nupkg; do
              echo "- \`$(basename "$package")\` — $(wc -c < "$package") bytes"
            done
            echo
            echo "The \`publish\` job pushes these to nuget.org. A dispatch with \`release: true\`"
            echo "also pushes the tag and opens a GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── The publish ───────────────────────────────────────────────────────────────────────────────
  #
  # Every run publishes. No condition on the job.
  #
  # ⚠ **Tagging is the one part that stays on the release dispatch, and the reason is mechanical
  # rather than a policy.** The `measure` job takes its baseline from
  # `git tag --list 'v*' --sort=-v:refname | head -1` and its alpha counter from
  # `git rev-list --count "$baseline"..HEAD`. A tag on every push makes that count 0 every time and
  # the baseline the previous commit, so every build would measure itself against its own parent and
  # the version numbers stop distinguishing anything.
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [measure, collect]

    environment:
      # ⚠ Load-bearing for trusted publishing, not decoration: the name goes into the OIDC token's
      # `environment` claim, and the policy on nuget.org is registered against it. Renaming this
      # breaks the token exchange. It is also where a required reviewer would go, if one is wanted.
      name: nuget

    permissions:
      # `contents: write` pushes the tag. ⚠ `id-token: write` is what trusted publishing runs on —
      # it lets this job ask GitHub for a short-lived OIDC token, which nuget.org exchanges for a
      # temporary API key. Without it `NuGet/login` fails with no token to send, and a job-level
      # `permissions:` block REPLACES the workflow default rather than adding to it, so both have to
      # be named here.
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v7
        with:
          pattern: packages-*
          path: packages
          merge-multiple: false

      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: notes

      # ⚠ The tag first, and it is what makes the next measurement possible. A published package
      # whose tag was never pushed leaves the following release with no baseline, and doc 18's
      # detectors then report "unmeasured" on a release that changed everything.
      #
      # ⚠ **Unverified, and this is the one step in the repository where the checkout bump could
      # bite.** `actions/checkout` moved from v4 to v7 for the Node 20 deprecation, and v6's one
      # behaviour change is that it persists the credential to a *separate file* rather than into
      # `.git/config`. Every other use of checkout here only reads. This one pushes, on the
      # credential checkout left behind, and it runs only on a `release: true` dispatch — so the
      # first real publish is also the first test of it. If it fails to authenticate, that is why.
      # ⚠ **A git identity, because `git tag -a` is a commit-shaped object and a runner has none.**
      # The release failed here on its first real run — `fatal: empty ident name` — and it failed in
      # `collect`, *after* three OS legs had built, tested, packed and smoke-tested the packages.
      # cross-platform.yml has set an identity for this reason since it started driving real git; this
      # workflow never did, because until the promotion landed no dispatch had ever reached an
      # annotated tag.
      - name: Give git an identity
        run: |
          git config user.email "release@skala.invalid"
          git config user.name "Skala Release"

      - name: Push the tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        run: |
          git tag -a "${{ needs.measure.outputs.tag }}" \
            -m "Skala ${{ needs.measure.outputs.version }} — ${{ needs.measure.outputs.bump }} against ${{ needs.measure.outputs.baseline || 'no previous release' }}"
          git push origin "${{ needs.measure.outputs.tag }}"

      # `NuGet/login` needs the nuget.org *profile name* — not an email address. It defaults to the
      # repository owner, which is the right answer whenever the GitHub owner and the nuget.org
      # profile share a name; set `secrets.NUGET_USER` to override.
      #
      # ⚠ Through `env:`, not `${{ }}` inside the script. A `run:` block with an expression
      # interpolated into it is assembled as text before bash sees it, so the value becomes shell
      # source; an environment variable is data. This job holds `contents: write` and
      # `id-token: write`, so it is worth being right about.
      - name: Resolve the publishing identity
        id: identity
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
          OWNER: ${{ github.repository_owner }}
        run: |
          user="${NUGET_USER:-$OWNER}"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "Publishing as nuget.org profile '$user'."

      # ⚠ **No API key is stored anywhere, and that is the whole point.** This asks GitHub for an
      # OIDC token describing this repository, this workflow file and this environment; nuget.org
      # validates the signature, matches it against a trusted publishing policy configured there,
      # and returns a temporary key. `secrets.NUGET_API_KEY` is gone and must not come back.
      #
      # ⚠ **The policy on nuget.org has to name this workflow file and this environment, exactly.**
      # Repository owner `Rikarin`, repository `SKALA`, workflow file `release.yml` — the file name
      # only, never the `.github/workflows/` path — and environment `nuget`, matching the
      # `environment:` above. Renaming this file or that environment breaks publishing, silently
      # until the next release.
      #
      # ⚠ **Immediately before the push, not earlier.** The temporary key lives one hour and each
      # OIDC token buys exactly one key. Hoisting this to the top of the job would spend the token
      # before the artefacts are even downloaded.
      #
      # ⚠ A policy can start *pending*: active for 7 days, then inactive unless a publish has
      # happened, because nuget.org needs the repository and owner IDs out of a real token to pin the
      # policy against a delete-and-recreate. nuget.org's docs say this "usually happens with private
      # GitHub repos" and `Rikarin/SKALA` is public, so it may not apply here — check the status on
      # nuget.org rather than assuming, since the window can be restarted but only before it lapses.
      - name: NuGet login (OIDC → temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ steps.identity.outputs.user }}

      - name: Push the packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          find packages -name '*.nupkg' -print0 | while IFS= read -r -d '' package; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

      # ⚠ Pre-release on NuGet is opt-in — `dotnet tool install` without `--prerelease` will not see
      # `2.0.0-alpha.N` — and this marks the GitHub Release the same way, so the two channels agree.
      - name: Open the GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ needs.measure.outputs.version }}" in
            *-*) prerelease="--prerelease" ;;
          esac

          gh release create "${{ needs.measure.outputs.tag }}" \
            --title "Skala ${{ needs.measure.outputs.version }}" \
            --notes-file notes/release-notes.md \
            $prerelease
